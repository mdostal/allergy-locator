id: s4-per-allergen-toggle
epic: allergy-map-mvp
title: Per-allergen toggle layer — isolate and color-code individual allergens
status: pending
complexity: medium
methodology: classic
depends_on: [s3-profile-input-manual-import]

description: |
  Extend the severity engine to compute a per-allergen score, not only a combined/blended
  score, and add toggle controls so a user can turn individual allergens on/off and see
  which one is actually driving a state's color. Combined ("whole panel") stays the
  default view; toggling isolates one allergen at a time for "which specific thing is
  driving this."

acceptance_criteria:
  - "Given the panel has multiple positive allergens, when a user toggles off all but one, then the map recolors to reflect only that allergen's severity, using `scoreByAllergen`, not the blended score."
  - "Given a state where one allergen dominates (e.g. Austin/TX for the author's grass-dominant panel), when grass is isolated via toggle, then it shows the same elevated result as the combined view; when a negative allergen (e.g. ragweed) is isolated, then it shows near-zero regardless of the state."
  - "Given the default (no toggles applied), when the map loads, then it shows the combined/blended score exactly as s2/s3 already did — toggling is additive, not a breaking change to existing behavior."
  - "Given `lib/severity/score.ts`, when unit-tested, then per-allergen assertions exist matching the Austin case (grass elevated, cedar/ragweed near-zero) from the oracle table."

steps:
  - id: research
    description: Confirm scoreByAllergen can be derived cleanly from the existing score.ts internals without duplicating the gate/season/climate logic.
    agent: researcher
  - id: implement
    description: Extend lib/severity/score.ts with scoreByAllergen(panel, state) -> Record<Allergen, number>; build components/AllergenToggle.tsx; wire UsMap to render combined or isolated based on toggle state.
    agent: developer
    depends_on: [research]
  - id: test
    description: Add per-allergen unit test assertions to tests/severity.test.ts.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm no logic duplication between the blended and per-allergen code paths.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to the feature branch.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/mdostal/Code/allergy-locator
  tech_stack:
    languages: [typescript]
    frameworks: [next.js, react]
  key_files:
    - path: lib/severity/score.ts
      purpose: Created in s2, blended-only — this story extends it, does not replace it.

references:
  - path: docs/E2E-TESTING.md
    relevant_excerpt: |
      Austin TX: Moderate-high from grass, and cedar shows negative on click-through —
      the canonical per-allergen isolation test case.

risks:
  - severity: low
    description: Per-allergen and blended scoring could drift out of sync if implemented as separate code paths.
    mitigation: scoreByAllergen and the blended score must share the same underlying gate/season/climate computation, differing only in aggregation.
