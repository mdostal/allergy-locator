id: s3-profile-input-manual-import
epic: allergy-map-mvp
title: Manual allergen picker + JSON/CSV panel import (any user, not just the author)
status: pending
complexity: medium
methodology: classic
depends_on: [s2-severity-engine-static-map]

description: |
  Replace s2's hardcoded author panel with real user input: a manual allergen picker
  (grasses/weeds/trees, by category) and a structured JSON/CSV panel import. Define the
  canonical panel schema now (`lib/panel-schema.ts`) — this becomes the exact target
  shape v2's future agentic parsing will populate (see `.pHive/planning/roadmap.md`), so
  treat it as a stable contract, not a throwaway shape. Nobody uploads a finished "map" —
  users provide raw allergen/severity data (their panel), and the app builds the map from
  it (corrected interpretation from round 1 review).

acceptance_criteria:
  - "Given the allergen picker, when a user selects/deselects allergens by category, then the map recolors immediately (client-side, no page reload)."
  - "Given a valid JSON panel file, when imported, then the map renders for that panel and the picker reflects the imported selections."
  - "Given a valid CSV panel file, when imported, then it produces the same result as the equivalent JSON import."
  - "Given a malformed or incomplete panel file, when imported, then a specific, user-facing error is shown and the app does NOT silently guess or partially apply the file."
  - "Given the author's preset, when selected via a 'load example' shortcut, then it populates the picker exactly as the hardcoded s2 version did, but is now just one importable panel among others."
  - "Given `lib/panel-schema.ts`, when inspected, then it is documented clearly enough (comments or an adjacent doc) that a future story could target it without re-deriving the shape from source."

steps:
  - id: research
    description: Decide the concrete JSON/CSV panel shape (allergen name, category, severity/reaction level) consistent with data/species-ranges.json's category taxonomy.
    agent: researcher
  - id: implement
    description: Build components/AllergenPicker.tsx, lib/panel-schema.ts, lib/panel-import.ts, lib/app-state.ts; wire UsMap to read the active panel from state instead of the s2 hardcode; convert the author preset into a loadable example.
    agent: developer
    depends_on: [research]
  - id: test
    description: Unit tests for panel-import.ts (valid JSON, valid CSV, malformed input rejected with a specific error); integration test that picker selections update the rendered map.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm the schema is genuinely stable/documented and that no raw uploaded file content is logged or persisted server-side (client-side only, per the no-backend-database constraint).
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to the feature branch.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/mdostal/Code/allergy-locator
  tech_stack:
    languages: [typescript]
    frameworks: [next.js, react]
  key_files:
    - path: data/presets/author.json
      purpose: Becomes the first "load example" panel rather than the only path (created in s2).
    - path: docs/E2E-TESTING.md
      purpose: "Privacy boundary: 'raw test PDFs / medical records stay OUT of the repo' — the schema and import flow must only ever handle the derived allergen/severity data, never a raw report."

files_to_modify:
  - file: lib/panel-schema.ts
    change: New — canonical panel JSON shape (future v2 contract).
  - file: lib/panel-import.ts
    change: New — JSON/CSV parse + validation.
  - file: lib/app-state.ts
    change: New — single active-panel state (context or small store).
  - file: components/AllergenPicker.tsx
    change: New — manual picker UI.

design_decisions:
  - decision: Ship JSON/CSV import in v1; explicitly no PDF/report parsing.
    rationale: Confirmed by user round 1 — PDF/OCR adds real technical and privacy-adjacent risk for a smaller-than-it-seems capability gain; agentic PDF/report parsing is v2 (roadmap.md), gated on a bring-your-own-LLM-key architecture.
  - decision: No save/multiple profiles in v1 — single active panel only.
    rationale: Corrected scope from round 1 — multi-profile/save/share is v3 (family use case), out of this epic.

risks:
  - severity: medium
    description: The panel schema becomes a de facto contract for v2's agentic parsing before v2 exists.
    mitigation: Document the schema explicitly now and treat later changes to it as breaking, even pre-v2.
