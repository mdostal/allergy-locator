id: s7-agent-controllable-url-state
epic: allergy-map-mvp
title: Serialize full map state (panel, toggles, timeframe) to URL query params
status: pending
complexity: low
methodology: classic
depends_on: [s5-timeframe-control]
parallel_allowed: true
parallel_rationale: bounded-slice
files_to_modify:
  - file: lib/url-state.ts
    change: New — serialize/deserialize {panel, toggles, timeframe} to/from URL query params.
  - file: components/AllergenPicker.tsx
    change: Wire selection changes to sync with URL state (read/write only, no scoring logic change).
  - file: components/AllergenToggle.tsx
    change: Wire toggle changes to sync with URL state.
  - file: components/TimeframeControl.tsx
    change: Wire timeframe changes to sync with URL state.

description: |
  Make the full map configuration (active panel, active allergen toggles, active
  timeframe) round-trip through the URL. This is v1's only "agentic" deliverable — no
  chat, no LLM, no MCP server ships here. It exists so a future agent (or a human sharing
  a link) can reproduce or drive a specific map view via a clean, documented state
  contract, without v2 (`.pHive/planning/roadmap.md`) requiring a rewrite of the state
  model. Deliberately thin: don't over-build this into a full API surface — that's v2's
  job when an MCP/tool-spec wrapper is actually needed.

acceptance_criteria:
  - "Given a fully configured map view (specific panel + toggles + timeframe), when the URL is copied and opened in a new tab/browser, then the exact same view renders."
  - "Given any of the picker, toggle, or timeframe controls change, when the change is made, then the URL updates to reflect it (e.g. via history.replaceState, not a full navigation)."
  - "Given a URL with no state params, when loaded, then the app falls back to its default state (no crash, no blank map)."
  - "Given a URL with a malformed/partial state param, when loaded, then the app falls back gracefully to defaults for the invalid portion rather than crashing."

steps:
  - id: research
    description: Confirm a compact, human-readable query-param encoding for the panel + toggle + timeframe shapes already defined in s3/s4/s5.
    agent: researcher
  - id: implement
    description: Build lib/url-state.ts; wire the three controls to read/write it.
    agent: developer
    depends_on: [research]
  - id: test
    description: Unit tests for serialize/deserialize round-tripping, including malformed-input fallback; a Playwright test opening a pre-built URL and asserting the resulting map state.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm this stays thin (state serialization only) and doesn't creep into building v2's agent API.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to the feature branch.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/mdostal/Code/allergy-locator
  tech_stack:
    languages: [typescript]
    frameworks: [next.js, react]

references:
  - path: .pHive/planning/roadmap.md
    relevant_excerpt: |
      v2 will target a documented, agent-friendly control surface — likely an MCP server
      or a small documented HTTP/JS API — built on top of this story's URL-state
      contract, not a replacement for it.

risks:
  - severity: low
    description: Scope creep into building a full agent API prematurely.
    mitigation: Explicitly bounded to URL query-param serialization only; the MCP/tool-spec wrapper is v2, out of this story and this epic.
