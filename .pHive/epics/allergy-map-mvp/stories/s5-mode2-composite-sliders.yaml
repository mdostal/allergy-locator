id: s5-mode2-composite-sliders
epic: allergy-map-mvp
title: "Mode 2: personalized composite via sensitivity sliders across all allergens"
status: pending
complexity: high
methodology: classic
depends_on: [s4-mode1-all-allergens]

description: |
  Build the actual reverse-lookup the product exists for: a sensitivity slider per
  allergen (looped from the same registry as Slice 4's toggles — no hardcoded slider
  list), combined into one personalized green→red composite score per city. The
  author's real panel (heavy grass, suppressed ragweed/cedar/oak/elm/mold) loads as the
  flagship "load example" default, expressed as slider values rather than a special
  code path — confirming the tool is general-purpose, not grass-limited, per the user's
  explicit statement: "MINE is mostly grass... however this is a general tool for
  anyone."

acceptance_criteria:
  - "Given the sensitivity slider panel, when it renders, then it shows one slider per allergen in `data/allergens.json`, generated by looping over the registry — no hardcoded per-allergen slider component."
  - "Given a user sets sliders for a subset of allergens, when the map renders, then it shows one composite green→red overlay (not per-allergen overlays — that's Mode 1) weighting exactly the allergens with nonzero sensitivity."
  - "Given the 'load author's example' shortcut, when clicked, then it populates the sliders to match the original grass-dominant, ragweed/cedar/oak/elm/mold-suppressed profile, and the resulting composite map is recognizable against the prior validated grass-only map."
  - "Given all sliders are set to zero, when the map renders, then it shows a neutral/undefined state (not a crash, not a false 'perfect everywhere' green)."
  - "Given a mode toggle between Mode 1 and Mode 2, when switched, then the UI clearly distinguishes 'what's out there' (Mode 1) from 'your personalized view' (Mode 2)."

steps:
  - id: research
    description: Decide the composite weighting formula (e.g. weighted sum vs. weighted max) and how it should behave when many allergens are active at once.
    agent: researcher
  - id: implement
    description: Build components/SensitivitySliders.tsx (loop-based), lib/severity/composite.ts, data/presets/author.json (slider-value form), and a Mode 1/Mode 2 UI switch.
    agent: developer
    depends_on: [research]
  - id: test
    description: Unit tests for composite.ts (weighting behavior, zero-sliders edge case); integration test that the author's example preset reproduces recognizable grass-dominant results.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm Mode 1 and Mode 2 are clearly distinguished in the UI and that no allergen-specific slider code was hardcoded.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to the feature branch.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/mdostal/Code/allergy-locator
  tech_stack:
    languages: [typescript]
    frameworks: [next.js, react]
  key_files:
    - path: lib/allergens/registry.ts
      purpose: Source of truth for which allergens get sliders.
    - path: docs/story/MY-ANSWER.md
      purpose: The author's ground-truth validation, used to sanity-check the composite reproduces recognizable results for his profile.

design_decisions:
  - decision: The author's example is expressed purely as slider values, not a special hardcoded code path.
    rationale: Confirms the general-purpose architecture — the flagship example must be reachable through the same mechanism any other user would use.

risks:
  - severity: medium
    description: Composite weighting formula could behave unexpectedly with many simultaneously-active allergens.
    mitigation: Explicit unit tests for multi-allergen weighting and the all-zero edge case.
