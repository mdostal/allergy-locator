id: s2-severity-engine-static-map
epic: allergy-map-mvp
title: Severity scoring engine + first interactive map render (single hardcoded panel)
status: pending
complexity: high
methodology: classic
depends_on: [s1-scaffold-deploy-skeleton]

description: |
  Build the highest-risk, highest-value logic in the project first: the presence-gate +
  severity-score engine from `docs/MODEL-NOTES.md`, proven against the author's own panel
  before any UI polish exists. "Static" here means baked build-time data + inlined-SVG
  rendering (see design-discussion.md §1a) — the map itself is a real, dynamic, clickable
  heatmap; only the active panel is hardcoded in this story (later stories make it
  user-driven).

  Scope for THIS story (presence + grass-season/climate layers only — turf/irrigation and
  arid-weed layers are explicitly deferred to s6-turf-arid-weed-data): the map should
  already correctly reproduce the oracle-table assertions that don't depend on those two
  layers — Coconino (green, suppresses juniper/ragweed noise), Austin (moderate-high from
  grass, cedar shows negative), Omaha (better-than-index via negative ragweed), WY Black
  Hills (greenest tier), and the AR/OK/TN grass belt (red, worst tier). Carlsbad, Mesa,
  and full Kalispell fidelity are NOT expected to pass yet — they need s6's layers.

acceptance_criteria:
  - "Given the author's preset panel (`data/presets/author.json`, created in this story from `docs/E2E-TESTING.md`'s fixture spec — derived allergen selections only, no raw medical documents), when the map renders, then Coconino/AZ, Omaha/NE, and the WY Black Hills region show green/low."
  - "Given the same panel, when the map renders, then the AR/OK/TN grass-belt region shows red/worst-tier."
  - "Given the same panel, when Austin/TX is inspected, then it shows moderate-high (grass-driven) and cedar/juniper/ragweed do NOT appear in the click-through 'your hits' list."
  - "Given a state is clicked, when the detail panel opens, then it lists the panel's present allergens, the season window, and a plain-English 'why' — sourced from the same engine that drives the color, not a separate hardcoded description."
  - "Given `lib/severity/` is unit-tested, when the test suite runs, then every oracle-table assertion achievable without turf/arid-weed data (per this story's scope note) passes, and the deferred ones (Carlsbad, Mesa) are present as explicitly-skipped/TODO tests referencing s6, not silently absent."

steps:
  - id: research
    description: Re-read docs/MODEL-NOTES.md and docs/E2E-TESTING.md in full; confirm the exact shape of data/species-ranges.json and data/allergen-map-data.md's season/climate inputs before writing the pipeline.
    agent: researcher
  - id: implement
    description: Write scripts/build-data.ts (presence + season/climate pass), lib/severity/gate.ts, lib/severity/score.ts (blended score), data/presets/author.json, components/UsMap.tsx, components/StateDetailPanel.tsx.
    agent: developer
    depends_on: [research]
  - id: test
    description: Write tests/severity.test.ts, table-driven from the E2E oracle's achievable-in-this-story assertions; write tests/data-integrity.test.ts checks (schema, no orphan state codes, Live-oak-UT still absent).
    agent: tester
    depends_on: [implement]
  - id: review
    description: Verify the color-vs-presence distinction is actually implemented (not accidentally a presence map) and that click-through content is engine-sourced, not duplicated.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to the feature branch.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/mdostal/Code/allergy-locator
  tech_stack:
    languages: [typescript]
    frameworks: [next.js, react, d3-geo]
  key_files:
    - path: data/species-ranges.json
      purpose: USDA presence data — the gate layer's direct input.
    - path: data/allergen-map-data.md
      purpose: Raw season/climate reference material to distill into severity-model.json.
    - path: data/us_states.svg
      purpose: Inlined map geometry — no external map CDN.
    - path: data/us_state_paths.json
      purpose: Per-state SVG path data for interactivity.
    - path: docs/MODEL-NOTES.md
      purpose: The coloring algorithm spec this story implements.
    - path: docs/E2E-TESTING.md
      purpose: The oracle table this story's unit tests are drawn from.

code_examples:
  - title: USDA presence data shape (gate layer input)
    file: data/species-ranges.json
    snippet: |
      {
        "species": {
          "Bermuda grass": ["AL","AR","AZ", "...", "WV"],
          "Bahiagrass": ["AL","AR","CA", "..."]
        }
      }
  - title: Map geometry shape (render layer input)
    file: data/us_state_paths.json
    snippet: |
      {"viewBox":"0 0 960 600","paths":{"AL":"M638,485L642,484...","...":"..."}}

files_to_modify:
  - file: scripts/build-data.ts
    change: New — normalizes species-ranges.json + season/climate inputs into severity-model.json (presence + climate layers only this story).
  - file: data/severity-model.json
    change: New (generated) — baked severity inputs.
  - file: data/presets/author.json
    change: New — the derived, privacy-safe author panel fixture.
  - file: lib/severity/gate.ts
    change: New — presence gate function.
  - file: lib/severity/score.ts
    change: New — blended severity score function.
  - file: components/UsMap.tsx
    change: New — SVG map render bound to the score function.
  - file: components/StateDetailPanel.tsx
    change: New — click-through detail panel.

design_decisions:
  - decision: Ship s2 with only presence + season/climate layers; defer turf/irrigation and arid-weed to s6.
    rationale: Keeps this story's scope thin and testable against a real subset of the oracle table, per the vertical-slicing invariant, rather than blocking the first working map on an open data-sourcing question.

references:
  - path: docs/MODEL-NOTES.md
    relevant_excerpt: |
      Gate (presence): which of the user's selected allergens occur in each state.
      Score: weight each present category by its season-length × intensity in that
      state's climate → green→red scale.
  - path: docs/E2E-TESTING.md
    relevant_excerpt: |
      Coconino/Flagstaff AZ: GREEN/low even though public indices read HIGH. Carlsbad NM:
      NOT green despite light grass (needs arid-weed layer — deferred to s6).

risks:
  - severity: high
    description: The severity formula is genuinely unvalidated, novel logic.
    mitigation: Unit tests are table-driven from the real E2E oracle, written alongside the engine, not after.
