id: s5-timeframe-control
epic: allergy-map-mvp
title: Date/timeframe control — climatological seasonal outlook
status: pending
complexity: medium
methodology: classic
depends_on: [s4-per-allergen-toggle]

description: |
  Add a date/timeframe dimension to the severity engine and UI, so users can move a
  control (e.g. a month selector) and see the map re-score for that point in the year —
  supporting trip/move planning across seasons, not just "right now." This ships as a
  **climatological/seasonal-outlook** feature: scored from the same season-length/
  intensity data already driving the static model, NOT live meteorological forecasting
  (which would require a paid, rate-limited provider and break the $0/no-key constraint —
  see design-discussion.md §4 Risk #7). This is explicitly flagged by the user as an area
  to iterate on rather than a one-shot final design.

acceptance_criteria:
  - "Given the timeframe control, when a user selects a different month, then the map re-scores using that month's position in each allergen's season window, for both the combined and per-allergen (s4) views."
  - "Given a grass-heavy state, when the timeframe is moved from peak grass season to off-season, then the score visibly drops — proving the timeframe parameter actually affects the computation, not just the label."
  - "Given no timeframe is selected, when the map loads, then it defaults to a sensible 'now' position (current month) without requiring any live weather API call."
  - "Given `lib/severity/score.ts`, when unit-tested, then at least one per-timeframe assertion exists showing a state's score change between two months for the same panel."
  - "Given the feature's framing, when documented (UI copy or code comments), then it is clearly labeled as a seasonal outlook, not a live/meteorological forecast — no UI copy should imply day-by-day weather-service accuracy."

steps:
  - id: research
    description: Confirm the season-window data already present (or to be baked in build-data.ts) has enough granularity (e.g. month-level) to drive a timeframe control meaningfully.
    agent: researcher
  - id: implement
    description: Extend the severity function signature with a timeframe parameter; build components/TimeframeControl.tsx; wire it into UsMap alongside the s4 toggle state.
    agent: developer
    depends_on: [research]
  - id: test
    description: Add per-timeframe unit test assertions.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm UI copy doesn't overstate the feature as live forecasting.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to the feature branch.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/mdostal/Code/allergy-locator
  tech_stack:
    languages: [typescript]
    frameworks: [next.js, react]

design_decisions:
  - decision: v1 timeframe control is a climatological/seasonal outlook, not live meteorological forecasting.
    rationale: Reconciles the user's "current AND forecast" ask with the zero-cost/zero-key hard constraint — true forecast providers are paid/rate-limited at scale. The existing optional Google-Pollen toggle remains the only "live conditions right now" path. User has explicitly accepted this as an iterative area (design-discussion.md §6 item 3).

risks:
  - severity: medium
    description: Users may expect real day-by-day forecasting once they see a date control, not a seasonal outlook.
    mitigation: Explicit UI copy distinguishing "seasonal outlook" from "forecast"; flagged as an iterative area to revisit with the user post-v1.
